name: Release Pedalion Chart

on:
  workflow_dispatch:
  push:
    branches: [default]
    paths:
      - cog.toml
      - .github/workflows/pedalion.yaml
      - pedalion/**

jobs:
  release:
    uses: katastroma/skeuotheke/.github/workflows/release-chart.yaml@v0
    permissions:
      contents: write
      packages: write
    with:
      chart_name: pedalion
      chart_path: pedalion
      package_name: pedalion
      registry: oci://ghcr.io/katastroma/phortion
