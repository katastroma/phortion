---
# ClusterRole (not a namespaced Role) because Applications live in tenant
# namespaces. Pedalion must watch across all namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/managed-by: katastroma
    app.kubernetes.io/part-of: katastroma
rules:
  - apiGroups: [katastroma.org]
    resources:
      - applications # Pedalion's primary resource. The CRD it operates on.
    verbs:
      - get # main: controller-runtime informer fetches individual Applications on change events
      - list # main: controller-runtime informer lists all Applications on initial cache sync at mgr.Start
      - watch # main: controller-runtime informer receives Application change events
