---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/managed-by: katastroma
    app.kubernetes.io/part-of: katastroma
rules:
  - apiGroups: [katastroma.org]
    resources:
      - applications # Pedalion's primary resource. The CRD it operates on.
    verbs:
      - get # main: controller-runtime informer fetches individual Applications on change events
      - list # main: controller-runtime informer lists all Applications on initial cache sync at mgr.Start
      - watch # main: controller-runtime informer receives Application change events
      - create # adopt: creates the root Application if it doesn't already exist

  - apiGroups: [apiextensions.k8s.io]
    resources:
      - customresourcedefinitions # Pedalion installs its own CRDs (operator pattern).
    verbs:
      - create # init: SSA creates the CRD if it doesn't exist
      - get # init: reads back the CRD after apply to confirm state
      - watch # init: watches CRDs until they reach the Established condition
      - patch # init: SSA patches the CRD if it already exists (schema updates)
      - delete # main: self-destruct removes CRDs after the root Application is gone

  - apiGroups: [apps]
    resources:
      - deployments # Pedalion's own Deployment.
    verbs:
      - delete # main: self-destruct removes pedalion's Deployment, killing its own pod

  - apiGroups: ['']
    resources:
      - serviceaccounts # Pedalion's own ServiceAccount.
    verbs:
      - delete # main: self-destruct removes pedalion's ServiceAccount

  - apiGroups: [rbac.authorization.k8s.io]
    resources:
      - clusterroles # Pedalion's own ClusterRole.
      - clusterrolebindings # Pedalion's own ClusterRoleBinding.
    verbs:
      - delete # main: self-destruct removes pedalion's ClusterRole and ClusterRoleBinding
