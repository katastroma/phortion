{{- if .Values.ingress.domain }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
spec:
  parentRefs:
    - name: {{ .Values.gateway_system.name }}
      namespace: {{ .Values.gateway_system.namespace }}
      sectionName: internal
  hostnames:
    - {{ .Values.ingress.subdomain }}.{{ .Values.ingress.domain }}
  rules:
    - backendRefs:
      - name: {{.Values.argocd.ref.name }}
        port: {{ .Values.argocd.ref.port }}
{{- end }}
