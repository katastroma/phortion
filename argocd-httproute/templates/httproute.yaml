{{- if or .Values.global.domain.internal .Values.global.domain.external }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: argocd
  name: {{ .Values.name }}
spec:
  parentRefs:
    {{- if .Values.global.domain.internal }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.global.gateway.name }}
      namespace: {{ .Values.global.gateway.namespace }}
      sectionName: internal
    {{- end }}
    {{- if .Values.global.domain.external }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.global.gateway.name }}
      namespace: {{ .Values.global.gateway.namespace }}
      sectionName: external
    {{- end }}
  hostnames:
    {{- if .Values.global.domain.internal }}
    - {{ .Values.ingress.subdomain }}.{{ .Values.global.domain.internal }}
    {{- end }}
    {{- if .Values.global.domain.external }}
    - {{ .Values.ingress.subdomain }}.{{ .Values.global.domain.external }}
    {{- end }}
  rules:
    - backendRefs:
      - group: ''
        kind: Service
        name: {{ .Values.argocd.ref.name }}
        port: {{ .Values.argocd.ref.port }}
        weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
