---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: {{ .Values.global.namespace }}
  name: {{ .Values.histia.name }}
  labels:
    app.kubernetes.io/managed-by: katastroma
    app.kubernetes.io/part-of: katastroma
---
# Histia needs to impersonate tenant deployer SAs for all mutations and list
# resources by label for pruning.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.histia.name }}
  labels:
    app.kubernetes.io/managed-by: katastroma
    app.kubernetes.io/part-of: katastroma
rules:
  - apiGroups: ['']
    resources:
      - serviceaccounts
    verbs:
      - impersonate
  - apiGroups: ['*']
    resources: ['*']
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.histia.name }}
  labels:
    app.kubernetes.io/managed-by: katastroma
    app.kubernetes.io/part-of: katastroma
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.histia.name }}
subjects:
  - kind: ServiceAccount
    namespace: {{ .Values.global.namespace }}
    name: {{ .Values.histia.name }}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.global.namespace }}
  name: {{ .Values.histia.name }}
  labels:
    app.kubernetes.io/managed-by: katastroma
    app.kubernetes.io/part-of: katastroma
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.histia.name }}
  ports:
    - name: grpc
      protocol: TCP
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.global.namespace }}
  name: {{ .Values.histia.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.histia.name }}
    app.kubernetes.io/managed-by: katastroma
    app.kubernetes.io/part-of: katastroma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.histia.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.histia.name }}
    spec:
      serviceAccountName: {{ .Values.histia.name }}
      containers:
        - name: provisioner
          image: {{ .Values.histia.image.repository }}:{{ .Values.histia.image.tag }}
