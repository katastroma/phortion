---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: {{ .Values.global.namespace }}
  name: {{ .Values.pharos.name }}
  labels:
    app.kubernetes.io/managed-by: katastroma
    app.kubernetes.io/part-of: katastroma
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.global.namespace }}
  name: {{ .Values.pharos.name }}
  labels:
    app.kubernetes.io/managed-by: katastroma
    app.kubernetes.io/part-of: katastroma
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.pharos.name }}
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.global.namespace }}
  name: {{ .Values.pharos.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.pharos.name }}
    app.kubernetes.io/managed-by: katastroma
    app.kubernetes.io/part-of: katastroma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.pharos.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.pharos.name }}
    spec:
      serviceAccountName: {{ .Values.pharos.name }}
      containers:
        - name: coordinator
          image: {{ .Values.pharos.image.repository }}:{{ .Values.pharos.image.tag }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: TEMPO_URL
              value: {{ .Values.pharos.env.tempoURL | quote }}
            - name: DETECTOR_INTERVAL
              value: {{ .Values.pharos.env.detectorInterval | quote }}
            - name: ORPHAN_AGE
              value: {{ .Values.pharos.env.orphanAge | quote }}
            - name: PORT
              value: {{ .Values.pharos.env.port | quote }}
            - name: GRPC_SERVER_ADDRESS
              value: :50051
            - name: OTEL_TRACES_EXPORTER
              value: {{ .Values.pharos.env.otelTracesExporter | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ .Values.pharos.env.otelMetricsExporter | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.pharos.env.otelExporterEndpoint | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
