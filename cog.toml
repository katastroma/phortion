from_latest_tag = false

[commit_types.ci]
bump_patch = true

[commit_types.perf]
bump_patch = true

[commit_types.refactor]
bump_patch = true

[commit_types.chore]
bump_patch = true

# [git_hooks]

[git_hooks.commit-msg]
script = """#!/bin/sh
set -e
cog verify --file $1
"""

[monorepo.packages.gateway]
path = "gateway"
include = [
    "cog.toml",
    ".github/workflows/gateway.yaml",
]

[monorepo.packages.argocd-httproute]
path = "argocd-httproute"
include = [
    "cog.toml",
    ".github/workflows/argocd-httproute.yaml",
]
