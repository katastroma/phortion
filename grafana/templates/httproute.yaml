{{- if .Values.ingress.domain }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: default
      namespace: gateway-system
      sectionName: internal
  hostnames:
    - {{ .Values.ingress.subdomain }}.{{ .Values.ingress.domain }}
  rules:
    - backendRefs:
        - name: grafana
          port: 80
{{- end }}
